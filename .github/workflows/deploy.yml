# ---------------------------------------------------------------------------
# نشر موقع «واصل شات» على GitHub Pages
# ---------------------------------------------------------------------------
# عند كل دفع إلى الفرع main:
#   1) يُبنى المشروع (tsc --noEmit && vite build)
#   2) يُنشر مجلد dist كموقع ثابت على GitHub Pages
#
# متغيرات المستودع المطلوبة (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL       : رابط مشروع Supabase
#   VITE_SUPABASE_ANON_KEY  : المفتاح العام (anon / publishable) — ليس سراً
#   VITE_VAPID_PUBLIC_KEY   : المفتاح العام لإشعارات Web Push — اختياري وليس سراً
#
# ملاحظة: يُمرَّر VITE_BASE_PATH=/wasel-chat/ في خطوة البناء (انظر env أدناه)
#         ليطابق مسار المستودع على GitHub Pages. محلياً وداخل Capacitor يبقى
#         base './' (نسبي) فلا يتأثر التشغيل المحلي إطلاقاً.
# ⚠️ عند إضافة نطاق مخصّص لاحقاً اجعل القيمة '/'.
# ---------------------------------------------------------------------------

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # المفتاح العام VAPID (ليس سراً). اتركه فارغاً لتعطيل إشعارات الخلفية.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          # مسار الأساس = اسم المستودع (موقع GitHub Pages على مسار فرعي)
          VITE_BASE_PATH: /wasel-chat/
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::متغيرا المستودع VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY غير مضبوطين."
            exit 1
          fi
          npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
